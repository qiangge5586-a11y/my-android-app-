name: Build compatibility checker APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HeadUnitHotspotCheck-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
