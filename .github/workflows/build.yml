name: Build Android APKs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon clean :app:assembleDebug :hondamonitor:assembleDebug
      - run: test -s hondamonitor/build/outputs/apk/debug/hondamonitor-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Honda-Car-Monitor-Chinese-debug
          path: hondamonitor/build/outputs/apk/debug/hondamonitor-debug.apk
          if-no-files-found: error