name: HondaHack Safe Rebuild

on:
  pull_request:
    branches: [main]
    paths:
      - 'reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/**'
      - '.github/workflows/hondahack-safe-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static safety checks
        run: python reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/tests/test_safe_rebuild.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build safe reconstruction APK
        run: gradle -p reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild assembleDebug --no-daemon

      - name: Verify APK identity and record checksum
        shell: bash
        run: |
          PROJECT="reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          REPORT="$PROJECT/build/verification"
          mkdir -p "$REPORT"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$REPORT/apk-badging.txt"
          grep -F "package: name='cn.autohack.hondahack.rebuild'" "$REPORT/apk-badging.txt"
          grep -F "sdkVersion:'17'" "$REPORT/apk-badging.txt"
          sha256sum "$APK" > "$REPORT/app-debug.apk.sha256"
          SHA="$(cut -d ' ' -f 1 "$REPORT/app-debug.apk.sha256")"
          {
            echo "## HondaHack Rebuild APK"
            echo "- Package: cn.autohack.hondahack.rebuild"
            echo "- minSdk: 17"
            echo "- SHA-256: $SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT/app-debug.apk.sha256"

      - name: Upload verified debug APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: hondahack-safe-rebuild-debug
          path: |
            reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/app/build/outputs/apk/debug/app-debug.apk
            reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/build/verification/apk-badging.txt
            reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/build/verification/app-debug.apk.sha256
          if-no-files-found: error
