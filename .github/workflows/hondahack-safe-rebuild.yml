name: HondaHack Safe Rebuild

on:
  pull_request:
    branches: [main]
    paths:
      - 'reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/**'
      - '.github/workflows/hondahack-safe-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build safe reconstruction APK
        run: gradle -p reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hondahack-safe-rebuild-debug
          path: reverse-engineering/hondahack-7.6.0/stage09/HondaHack-Rebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
