name: HondaHack Enhancement Prototype

on:
  push:
    branches:
      - feature/hondahack-7.7.0-enhancement-center
    paths:
      - 'hondahack-enhancement-prototype/**'
      - '.github/workflows/hondahack-enhancement-prototype.yml'
  pull_request:
    paths:
      - 'hondahack-enhancement-prototype/**'
      - '.github/workflows/hondahack-enhancement-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hondahack-enhancement-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hondahack-enhancement-prototype-debug
          path: hondahack-enhancement-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
