name: Analyze DiPlay APK

on:
  push:
    paths:
      - '.github/workflows/analyze-diplay.yml'
      - 'DiPlay0.3.3.apk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install static analysis tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y unzip file
          mkdir -p tools report
          curl -fL --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fL --retry 3 -o tools/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          mkdir -p tools/jadx
          unzip -q tools/jadx.zip -d tools/jadx
          chmod +x tools/jadx/bin/jadx
          java -jar tools/apktool.jar d -f -s DiPlay0.3.3.apk -o decoded
          tools/jadx/bin/jadx --no-res --show-bad-code -d decompiled DiPlay0.3.3.apk || true

      - name: Generate identification report
        shell: bash
        run: |
          set -eu
          {
            echo '# DiPlay0.3.3.apk 静态分析报告'
            echo
            echo '- 分析方式：静态解包/反编译；没有安装或运行 APK。'
            echo "- 文件大小：$(stat -c '%s bytes' DiPlay0.3.3.apk)"
            echo "- SHA-256：$(sha256sum DiPlay0.3.3.apk | awk '{print $1}')"
            echo
            echo '## APK 文件结构'
            unzip -l DiPlay0.3.3.apk | head -100
            echo
            echo '## Manifest 身份、组件和权限'
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='decoded/AndroidManifest.xml'
          root=ET.parse(p).getroot()
          A='{http://schemas.android.com/apk/res/android}'
          print('package:',root.attrib.get('package'))
          print('versionCode:',root.attrib.get(A+'versionCode'))
          print('versionName:',root.attrib.get(A+'versionName'))
          uses=root.find('uses-sdk')
          if uses is not None: print('uses-sdk:',uses.attrib)
          for tag in ('uses-permission','uses-permission-sdk-23'):
              for x in root.findall(tag): print(tag+':',x.attrib.get(A+'name'))
          app=root.find('application')
          if app is not None:
              print('application:',app.attrib)
              for tag in ('activity','activity-alias','service','receiver','provider'):
                  for x in app.findall(tag):
                      print(tag+':',x.attrib.get(A+'name'), 'exported='+str(x.attrib.get(A+'exported')))
          PY
            echo
            echo '## 签名证书文件'
            unzip -Z1 DiPlay0.3.3.apk | grep -Ei '^META-INF/.*\.(RSA|DSA|EC)$' || true
            mkdir -p certs
            unzip -j -o DiPlay0.3.3.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' -d certs >/dev/null 2>&1 || true
            for f in certs/*; do
              [ -f "$f" ] || continue
              echo "--- $f"
              keytool -printcert -file "$f" 2>&1 || true
            done
            echo
            echo '## 源码/资源中的关键特征与 URL'
            grep -RInE -m 300 'hostapd|热点|蓝牙|Bluetooth|CarPlay|Android Auto|Wi.?Fi|WifiManager|tether|APN|socket|TLS|WebSocket|github\.com|gitlab\.com|https?://' decoded decompiled 2>/dev/null | head -300 || true
            echo
            echo '## DEX 类名线索'
            find decompiled -type f -name '*.java' 2>/dev/null | sed 's#^decompiled/##' | head -500
          } > report/DiPlay0.3.3-analysis.md
          cp decoded/AndroidManifest.xml report/AndroidManifest.xml
          find DiPlay0.3.3.apk -maxdepth 0 -type f -exec file {} \; > report/file-type.txt

      - name: Upload static analysis report
        uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.3-static-analysis
          path: report/
          retention-days: 14
