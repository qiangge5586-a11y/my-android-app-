name: Analyze DiPlay APK

on:
  push:
    paths:
      - '.github/workflows/analyze-diplay.yml'
      - 'DiPlay0.3.3.apk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install static analysis tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y unzip file
          mkdir -p tools report
          curl -fL --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fL --retry 3 -o tools/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          mkdir -p tools/jadx
          unzip -q tools/jadx.zip -d tools/jadx
          chmod +x tools/jadx/bin/jadx
          java -jar tools/apktool.jar d -f -s DiPlay0.3.3.apk -o decoded
          tools/jadx/bin/jadx --no-res --show-bad-code -d decompiled DiPlay0.3.3.apk || true
          if [ -f decoded/assets/hotspot/bt.dex ]; then
            tools/jadx/bin/jadx --show-bad-code -d bt-decompiled decoded/assets/hotspot/bt.dex || true
          fi

      - name: Generate report and package reconstructed source
        shell: bash
        run: |
          set -eu
          {
            echo '# DiPlay0.3.3.apk 静态分析报告'
            echo
            echo '- 分析方式：静态解包/反编译；没有安装或运行 APK。'
            echo "- 文件大小：$(stat -c '%s bytes' DiPlay0.3.3.apk)"
            echo "- SHA-256：$(sha256sum DiPlay0.3.3.apk | awk '{print $1}')"
            echo
            echo '## APK 文件结构'
            unzip -l DiPlay0.3.3.apk | head -100 || true
            echo
            echo '## Manifest 身份、组件和权限'
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='decoded/AndroidManifest.xml'
          root=ET.parse(p).getroot()
          A='{http://schemas.android.com/apk/res/android}'
          print('package:',root.attrib.get('package'))
          print('versionCode:',root.attrib.get(A+'versionCode'))
          print('versionName:',root.attrib.get(A+'versionName'))
          uses=root.find('uses-sdk')
          if uses is not None: print('uses-sdk:',uses.attrib)
          for tag in ('uses-permission','uses-permission-sdk-23'):
              for x in root.findall(tag): print(tag+':',x.attrib.get(A+'name'))
          app=root.find('application')
          if app is not None:
              print('application:',app.attrib)
              for tag in ('activity','activity-alias','service','receiver','provider'):
                  for x in app.findall(tag):
                      print(tag+':',x.attrib.get(A+'name'), 'exported='+str(x.attrib.get(A+'exported')))
          PY
            echo
            echo '## 签名证书'
            unzip -Z1 DiPlay0.3.3.apk | grep -Ei '^META-INF/.*\.(RSA|DSA|EC)$' || true
            mkdir -p certs
            unzip -j -o DiPlay0.3.3.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' -d certs >/dev/null 2>&1 || true
            for f in certs/*; do
              [ -f "$f" ] || continue
              echo "--- $f"
              keytool -printcert -file "$f" 2>&1 || true
            done
            echo
            echo '## 反编译 Java 文件统计'
            find decompiled bt-decompiled -type f -name '*.java' 2>/dev/null | wc -l || true
            echo
            echo '## 源码关键特征与 URL'
            grep -RInE -m 300 'hostapd|热点|蓝牙|Bluetooth|CarPlay|Android Auto|WifiManager|tether|socket|TLS|WebSocket|github\.com|gitlab\.com|https?://' decoded decompiled bt-decompiled 2>/dev/null | head -300 || true
            echo
            echo '## DEX 类名线索'
            find decompiled bt-decompiled -type f -name '*.java' 2>/dev/null | sed -e 's#^decompiled/##' -e 's#^bt-decompiled/##' | head -1000 || true
          } > report/DiPlay0.3.3-analysis.md
          cp decoded/AndroidManifest.xml report/AndroidManifest.xml
          if [ -d decompiled/sources ]; then
            cp -a decompiled/sources report/decompiled-sources
          elif [ -d decompiled ]; then
            cp -a decompiled report/decompiled
          fi
          if [ -d bt-decompiled/sources ]; then
            cp -a bt-decompiled/sources report/bt-decompiled-sources
          elif [ -d bt-decompiled ]; then
            cp -a bt-decompiled report/bt-decompiled
          fi
          find DiPlay0.3.3.apk -maxdepth 0 -type f -exec file {} \; > report/file-type.txt
          # Preserve original APK, decoded resources/assets/native libs and raw DEX.
          mkdir -p report/original-apk report/apktool-decoded report/raw-dex
          cp DiPlay0.3.3.apk report/original-apk/
          cp -a decoded/. report/apktool-decoded/
          unzip -j -o DiPlay0.3.3.apk 'classes*.dex' -d report/raw-dex >/dev/null
          if [ -f decoded/assets/hotspot/bt.dex ]; then
            mkdir -p report/raw-dex/assets-hotspot
            cp decoded/assets/hotspot/bt.dex report/raw-dex/assets-hotspot/
          fi
          {
            echo '# 完整逆向工程包说明'
            echo '- original-apk/: 原始 APK'
            echo '- apktool-decoded/: 完整解包资源、assets、lib、Manifest'
            echo '- raw-dex/: 原始 classes*.dex 和 bt.dex'
            echo '- decompiled-sources/: JADX Java 反编译源码'
            echo '- bt-decompiled-sources/: bt.dex 反编译源码'
            echo '注意：这不是开发者原始 Gradle 工程；反编译可能不完整，.so 保留为二进制。'
          } > report/README-完整逆向工程包.md

      - name: Upload source and analysis report
        uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.3-decompiled-source
          path: report/
          retention-days: 14
