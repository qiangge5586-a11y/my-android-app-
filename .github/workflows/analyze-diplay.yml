name: Analyze DiPlay APK

on:
  push:
    paths:
      - '.github/workflows/analyze-diplay.yml'
      - 'DiPlay0.3.3.apk'
      - 'docs/DiPlay-v0.3.3-hotspot-hardening.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode APK with smali
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fL --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          java -jar apktool.jar d -f DiPlay0.3.3.apk -o decoded
          jadx/bin/jadx --no-res --show-bad-code -d decompiled DiPlay0.3.3.apk || true
          mkdir -p bt-decompiled
          if [ -f decoded/assets/hotspot/bt.dex ]; then jadx/bin/jadx --show-bad-code -d bt-decompiled decoded/assets/hotspot/bt.dex || true; fi
      - name: Package decoded smali and source
        shell: bash
        run: |
          set -eu
          mkdir -p report/smali report/source
          for d in decoded/smali*; do [ -d "$d" ] && cp -a "$d" report/smali/; done
          cp -a decompiled/sources/. report/source/ 2>/dev/null || true
          cp -a bt-decompiled/sources/. report/source/ 2>/dev/null || true
          cp -a decoded/AndroidManifest.xml report/
          cp DiPlay0.3.3.apk report/
          sha256sum DiPlay0.3.3.apk > report/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.3-smali-source
          path: report/
          retention-days: 14
