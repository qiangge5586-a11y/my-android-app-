name: Analyze and patch DiPlay APK

on:
  push:
    paths:
      - '.github/workflows/analyze-diplay.yml'
      - 'DiPlay0.3.3.apk'
      - 'docs/DiPlay-v0.3.3-hotspot-hardening.md'
      - 'scripts/patch_diplay_hotspot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode APK with smali
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fL --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          java -jar apktool.jar d -f DiPlay0.3.3.apk -o decoded
          jadx/bin/jadx --no-res --show-bad-code -d decompiled DiPlay0.3.3.apk || true
          mkdir -p bt-decompiled
          if [ -f decoded/assets/hotspot/bt.dex ]; then jadx/bin/jadx --show-bad-code -d bt-decompiled decoded/assets/hotspot/bt.dex || true; fi
      - name: Patch hotspot Smali and rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_diplay_hotspot.py
          python3 scripts/patch_diplay_hotspot.py decoded
          mkdir -p build
          java -jar apktool.jar b decoded -o build/DiPlay-v0.3.3-hotspot-hardened-unsigned.apk
          unzip -t build/DiPlay-v0.3.3-hotspot-hardened-unsigned.apk
          sha256sum DiPlay0.3.3.apk build/DiPlay-v0.3.3-hotspot-hardened-unsigned.apk | tee build/SHA256.txt
      - name: Sign and verify test APK
        uses: android-actions/setup-android@v3
      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          UNSIGNED="build/DiPlay-v0.3.3-hotspot-hardened-unsigned.apk"
          ALIGNED="build/DiPlay-v0.3.3-hotspot-hardened-aligned.apk"
          SIGNED="build/DiPlay-v0.3.3-hotspot-hardened.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -noprompt -keystore build/diplay-test-signing.jks \
            -storepass "diplay-build-test" -keypass "diplay-build-test" \
            -alias diplay-test -dname "CN=DiPlay Test Build,O=Local Test,C=US" \
            -validity 10000 -keyalg RSA -keysize 2048
          "$BT/apksigner" sign --ks build/diplay-test-signing.jks \
            --ks-key-alias diplay-test --ks-pass pass:diplay-build-test \
            --key-pass pass:diplay-build-test --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee build/signature-verification.txt
          "$BT/aapt" dump badging "$SIGNED" | grep "^package:" | tee build/package-info.txt
          grep -q "name='com.shihab.diplay'" build/package-info.txt
          sha256sum "$SIGNED" >> build/SHA256.txt
          rm -f build/diplay-test-signing.jks build/DiPlay-v0.3.3-hotspot-hardened-aligned.apk
      - name: Package decoded smali and source
        shell: bash
        run: |
          set -eu
          mkdir -p report/smali report/source
          for d in decoded/smali*; do [ -d "$d" ] && cp -a "$d" report/smali/; done
          cp -a decompiled/sources/. report/source/ 2>/dev/null || true
          cp -a bt-decompiled/sources/. report/source/ 2>/dev/null || true
          cp -a decoded/AndroidManifest.xml report/
          cp DiPlay0.3.3.apk report/
          cp build/SHA256.txt report/
      - uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.3-hotspot-hardened-signed
          path: |
            report/
            build/DiPlay-v0.3.3-hotspot-hardened.apk
            build/SHA256.txt
            build/signature-verification.txt
            build/package-info.txt
          retention-days: 14
