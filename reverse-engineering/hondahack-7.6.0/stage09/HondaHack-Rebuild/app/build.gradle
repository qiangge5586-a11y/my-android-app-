plugins { id 'com.android.application' }

android {
    namespace 'cn.autohack.hondahack'
    compileSdk 35
    defaultConfig {
        // Keep the rebuild installable beside the original APK; never replace it implicitly.
        applicationId 'cn.autohack.hondahack.rebuild'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1-reconstruction'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
