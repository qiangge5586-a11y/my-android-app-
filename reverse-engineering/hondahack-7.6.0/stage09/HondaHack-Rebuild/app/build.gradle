plugins { id 'com.android.application' }

android {
    namespace 'cn.autohack.hondahack'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.autohack.hondahack'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1-reconstruction'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
}
